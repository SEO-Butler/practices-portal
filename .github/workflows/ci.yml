name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  # Prisma's CLI/config requires the variable to exist; the checks job never
  # actually connects to a database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    name: Integration smoke (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: practices
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/practices
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: node prisma/seed.mjs
      - run: npm run build
      - name: Start server and run smoke test
        run: |
          PORT=3100 npm start &
          SERVER_PID=$!
          bash scripts/smoke.sh http://localhost:3100
          kill $SERVER_PID
